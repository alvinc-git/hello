name: CI & Packaging

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*', '[0-9]*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  debian-build:
    name: Debian Package Build & Lint
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential autoconf automake pkg-config cargo \
            debhelper dpkg-dev fakeroot lintian file xz-utils ca-certificates curl git

      - name: Configure safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and verify Debian packages
        run: |
          chmod +x ci/build.sh
          ./ci/build.sh

      - name: Upload Debian artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages
          path: build/dist/*
          if-no-files-found: error

  rpm-build:
    name: RPM Package Build
    runs-on: ubuntu-latest
    container:
      image: rockylinux:9
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install RPM build dependencies
        run: |
          dnf install -y epel-release || true
          dnf install -y rpm-build gcc make autoconf automake libtool cargo file xz git

      - name: Configure safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build RPM packages
        run: |
          chmod +x ci/build-rpm.sh
          ./ci/build-rpm.sh

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-packages
          path: |
            hello-1.0.0/rpm/RPMS/**/*.rpm
            hello-1.0.0/rpm/SRPMS/**/*.rpm
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ debian-build, rpm-build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*
            release-artifacts/**/*.rpm
          generate_release_notes: true

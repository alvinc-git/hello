name: CI & Packaging

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*', '[0-9]*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  debian-build:
    name: Debian Package Build & Lint (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Build Debian packages in Docker container
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            -e GITHUB_REF_NAME="${{ github.ref_name }}" \
            debian:bookworm bash -c "
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                build-essential autoconf automake pkg-config cargo \
                debhelper dpkg-dev fakeroot lintian file xz-utils ca-certificates curl git
              git config --global --add safe.directory /workspace
              chmod +x ci/build.sh
              ./ci/build.sh
            "

      - name: Upload Debian artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages-${{ matrix.arch }}
          path: build/dist/*
          if-no-files-found: error

  rpm-build:
    name: RPM Package Build
    runs-on: ubuntu-latest
    container:
      image: rockylinux:9
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install RPM build dependencies
        run: |
          dnf install -y epel-release || true
          dnf install -y rpm-build gcc make autoconf automake libtool cargo file xz git

      - name: Configure safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build RPM packages
        run: |
          chmod +x ci/build-rpm.sh
          ./ci/build-rpm.sh

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-packages
          path: |
            hello-1.0.0/rpm/RPMS/**/*.rpm
            hello-1.0.0/rpm/SRPMS/**/*.rpm
          if-no-files-found: error

  flatpak-build:
    name: Flatpak Package Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Flatpak & flatpak-builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.freedesktop.Sdk.Extension.rust-stable//24.08

      - name: Build Flatpak packages
        run: |
          chmod +x ci/build-flatpak.sh
          ./ci/build-flatpak.sh

      - name: Upload Flatpak artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-packages
          path: hello-1.0.0/flatpak/dist/*.flatpak
          if-no-files-found: error

  appimage-build:
    name: AppImage Package Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake pkg-config cargo \
            libfuse2 file xz-utils curl git

      - name: Build AppImage package
        run: |
          chmod +x ci/build-appimage.sh
          ./ci/build-appimage.sh

      - name: Upload AppImage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appimage-packages
          path: hello-1.0.0/appimage/dist/*.AppImage
          if-no-files-found: error

  msi-build:
    name: Windows MSI Package Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cross-build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wixl msitools gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Build MSI package
        run: |
          chmod +x ci/build-msi.sh
          ./ci/build-msi.sh

      - name: Upload MSI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: msi-packages
          path: hello-1.0.0/msi/dist/*.msi
          if-no-files-found: error

  homebrew-build:
    name: macOS & Homebrew Build
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          brew install autoconf automake libtool

      - name: Build and verify Homebrew formula
        run: |
          chmod +x ci/build-homebrew.sh
          ./ci/build-homebrew.sh

      - name: Upload Homebrew formula artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: hello-1.0.0/homebrew/dist/hello.rb
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ debian-build, rpm-build, flatpak-build, appimage-build, msi-build, homebrew-build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*
            release-artifacts/**/*.rpm
            release-artifacts/**/*.flatpak
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.msi
            release-artifacts/**/*.rb
          generate_release_notes: true

# Bitbucket Pipelines for hello
#
# Two behaviours:
#   * every branch push  -> build and verify, publish nothing
#   * a v* tag push      -> build, verify, then upload artifacts to the
#                           repository Downloads area
#
# ---------------------------------------------------------------------------
# IMPORTANT: choose this image to match your OLDEST deployment target.
#
# Building on a newer distribution than you deploy to produces a
# package that refuses to install with an unsatisfiable libc6 dependency.
# Building on an older one is always safe.
#
# Verify with:  dpkg-deb -f hello*.deb Depends
# ---------------------------------------------------------------------------
image: debian:bookworm

definitions:
  steps:
    - step: &build-and-verify
        name: Build and verify
        script:
          - export DEBIAN_FRONTEND=noninteractive
          - apt-get update -qq
          - apt-get install -y --no-install-recommends
              build-essential autoconf automake pkg-config cargo
              debhelper dpkg-dev fakeroot lintian file xz-utils ca-certificates curl
          - chmod +x ci/build.sh
          - ./ci/build.sh
        artifacts:
          - build/dist/**

pipelines:
  # Any branch: prove it still builds and lints.  Nothing is published.
  default:
    - step: *build-and-verify

  # Tag push: build, then publish.
  tags:
    'v*':
      - step: *build-and-verify
      - step:
          name: Publish to Bitbucket Downloads
          # Gate publishing behind a deployment environment so the credentials
          # can be scoped there and the upload can require manual approval.
          deployment: production
          script:
            - export DEBIAN_FRONTEND=noninteractive
            - apt-get update -qq
            - apt-get install -y --no-install-recommends curl ca-certificates
            - chmod +x ci/publish.sh
            - ./ci/publish.sh

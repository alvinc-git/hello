app-id: io.github.alvinc_git.hello
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: hello

finish-args:
  # Standard command-line application sandbox permissions
  - --share=network
  - --filesystem=host

modules:
  - name: hello
    buildsystem: autotools
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/hello/cargo
    sources:
      - type: dir
        path: ..
    post-install:
      - if [ -f flatpak/io.github.alvinc_git.hello.metainfo.xml ]; then install -Dm644 flatpak/io.github.alvinc_git.hello.metainfo.xml /app/share/metainfo/io.github.alvinc_git.hello.metainfo.xml; elif [ -f io.github.alvinc_git.hello.metainfo.xml ]; then install -Dm644 io.github.alvinc_git.hello.metainfo.xml /app/share/metainfo/io.github.alvinc_git.hello.metainfo.xml; fi
      - if [ -f flatpak/io.github.alvinc_git.hello.desktop ]; then install -Dm644 flatpak/io.github.alvinc_git.hello.desktop /app/share/applications/io.github.alvinc_git.hello.desktop; elif [ -f io.github.alvinc_git.hello.desktop ]; then install -Dm644 io.github.alvinc_git.hello.desktop /app/share/applications/io.github.alvinc_git.hello.desktop; fi

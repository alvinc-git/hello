name: hello
version: '1.0.0'
summary: Standard Hello program in C, Rust, and Go
description: |
  hello is the standard Hello program, featuring lightweight C99,
  zero-dependency pure Rust, and Go implementations.

grade: stable
confinement: strict
base: core24

apps:
  hello:
    command: usr/bin/hello
  hello_rust:
    command: usr/bin/hello_rust
  hello_go:
    command: usr/bin/hello_go

parts:
  hello:
    plugin: autotools
    source: ..
    autotools-configure-parameters:
      - --prefix=/usr
    build-packages:
      - gcc
      - make
      - autoconf
      - automake
      - cargo
      - golang-go
    stage-packages: []
